[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entrysignallab"
version = "0.25.0"
description = "Reproducible preannouncement and market-entry timing analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hongmei Li", email = "Hongmeili@symc.edu.cn"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/Hongmeili-marker/EntrySignalLab"
Documentation = "https://github.com/Hongmeili-marker/EntrySignalLab/blob/main/README.md"
Issues = "https://github.com/Hongmeili-marker/EntrySignalLab/issues"
Release = "https://github.com/Hongmeili-marker/EntrySignalLab/releases/tag/v0.25.0"
DOI = "https://doi.org/10.5281/zenodo.23565682"
Archive = "https://zenodo.org/records/23565682"

[project.scripts]
entrysignal = "entrysignallab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

